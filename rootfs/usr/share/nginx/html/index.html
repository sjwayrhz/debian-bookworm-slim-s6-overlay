<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Time Monitor</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .time-container {
            text-align: center;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem 4rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        .time {
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-variant-numeric: tabular-nums; /* 防止数字跳动 */
            min-width: 14ch; /* 预留宽度 */
        }
        .date {
            font-size: 1.2rem;
            margin-top: 20px;
            opacity: 0.8;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="time-container">
        <div id="time-display" class="time">Connecting...</div>
        <div class="date">SERVER TIME (UTC+8)</div>
    </div>

    <script>
        const timeDisplay = document.getElementById('time-display');

        async function updateTime() {
            try {
                // 添加时间戳参数 (?t=...) 以防止浏览器缓存 fetch 请求
                const response = await fetch('time.txt?t=' + Date.now());
                if (response.ok) {
                    const timeText = await response.text();
                    timeDisplay.innerText = timeText.trim();
                }
            } catch (error) {
                console.error('Failed to fetch time:', error);
            }
        }

        // 立即执行一次
        updateTime();

        // 每秒轮询一次后台生成的文件
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
