<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>S6-Overlay Time Monitor</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        #clock {
            font-size: 3rem;
            color: #1a73e8;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Server Status: Running</h1>
        <div id="clock">Loading...</div>
        <p style="color: #666;">Timezone: UTC+8 (Beijing)</p>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            // 转换为 UTC+8 格式
            const options = {
                timeZone: 'Asia/Shanghai',
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: false
            };
            const formatter = new Intl.DateTimeFormat('zh-CN', options);
            document.getElementById('clock').innerHTML = formatter.format(now);
        }
        setInterval(updateClock, 1000);
        updateClock(); 
    </script>
</body>

</html>
