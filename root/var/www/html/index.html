<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>S6 容器监控面板</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #020617; color: #f8fafc; margin: 0; }
        .card { text-align: center; border: 1px solid #1e293b; padding: 4rem; border-radius: 2.5rem; background: #0f172a; }
        #clock { font-size: 8rem; font-weight: 900; color: #38bdf8; }
        #date { font-size: 1.5rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <div id="clock">--:--:--</div>
        <div id="date">----/--/--</div>
    </div>
    <script>
        async function fetchTime() {
            try {
                const res = await fetch('/time.json?' + new Date().getTime());
                const data = await res.json();
                document.getElementById('clock').innerText = data.time;
                document.getElementById('date').innerText = data.date;
            } catch (e) {}
        }
        setInterval(fetchTime, 1000);
        fetchTime();
    </script>
</body>
</html>
